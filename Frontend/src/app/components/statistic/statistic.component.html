<div class="stats-grid" [@fadeIn]>
  <mat-card class="stat-card">
    <mat-card-content>
      <div class="stat-icon">
        <mat-icon>group_work</mat-icon>
      </div>
      <div class="stat-value">{{ stats.teams }}</div>
      <div class="stat-label">Csapatok</div>
    </mat-card-content>
  </mat-card>

  <mat-card class="stat-card">
    <mat-card-content>
      <div class="stat-icon">
        <mat-icon>person</mat-icon>
      </div>
      <div class="stat-value">{{ stats.drivers }}</div>
      <div class="stat-label">Versenyzők</div>
    </mat-card-content>
  </mat-card>

  <mat-card class="stat-card">
    <mat-card-content>
      <div class="stat-icon">
        <mat-icon>map</mat-icon>
      </div>
      <div class="stat-value">{{ stats.circuits }}</div>
      <div class="stat-label">Pályák</div>
    </mat-card-content>
  </mat-card>

  <mat-card class="stat-card">
    <mat-card-content>
      <div class="stat-icon">
        <mat-icon>flag</mat-icon>
      </div>
      <div class="stat-value">{{ stats.races }}</div>
      <div class="stat-label">Versenyek</div>
    </mat-card-content>
  </mat-card>

  <mat-card class="stat-card">
    <mat-card-content>
      <div class="stat-icon">
        <mat-icon>emoji_events</mat-icon>
      </div>
      <div class="stat-value">{{ stats.results }}</div>
      <div class="stat-label">Eredmények</div>
    </mat-card-content>
  </mat-card>
</div>
