<table mat-table [dataSource]="dataSource" class="mat-elevation-z4 clean-table">

  <ng-container matColumnDef="nr">
    <th mat-header-cell *matHeaderCellDef>#</th>
    <td mat-cell *matCellDef="let race; let i = index">{{ i + 1 }}</td>
  </ng-container>

  <ng-container matColumnDef="round">
    <th mat-header-cell *matHeaderCellDef>Round</th>
    <td mat-cell *matCellDef="let race">
      <span *ngIf="editId !== race.id">{{ race.round }}</span>
      <input *ngIf="editId === race.id" [(ngModel)]="editRace.round" class="input-cell">
    </td>
  </ng-container>

  <ng-container matColumnDef="grandPrix">
    <th mat-header-cell *matHeaderCellDef>Grand Prix</th>
    <td mat-cell *matCellDef="let race">
      <span *ngIf="editId !== race.id">{{ race.grandPrix }}</span>
      <input *ngIf="editId === race.id" [(ngModel)]="editRace.grandPrix" class="input-cell">
    </td>
  </ng-container>

  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef>Date</th>
    <td mat-cell *matCellDef="let race">
      <span *ngIf="editId !== race.id">{{ race.date | date:'yyyy-MM-dd' }}</span>
      <input *ngIf="editId === race.id" [(ngModel)]="editRace.date" type="date" class="input-cell">
    </td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let race">
      <span *ngIf="editId !== race.id">{{ race.status }}</span>
      <input *ngIf="editId === race.id" [(ngModel)]="editRace.status" class="input-cell">
    </td>
  </ng-container>

  <ng-container matColumnDef="circuitId">
    <th mat-header-cell *matHeaderCellDef>Circuit</th>
    <td mat-cell *matCellDef="let race">
      <span *ngIf="editId !== race.id">{{ race.circuitId }}</span>
      <input *ngIf="editId === race.id" [(ngModel)]="editRace.circuitId" class="input-cell">
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let race">
      <div class="action-buttons">
        <button mat-icon-button color="primary" *ngIf="editId !== race.id" (click)="startEdit(race)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="accent" *ngIf="editId === race.id" (click)="update()">
          <mat-icon>save</mat-icon>
        </button>
        <button mat-icon-button *ngIf="editId === race.id" (click)="cancelEdit()">
          <mat-icon>close</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="delete(race.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns;"></tr>

</table>
