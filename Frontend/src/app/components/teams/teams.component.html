<table mat-table [dataSource]="dataSource" class="mat-elevation-z4 clean-table">
  <ng-container matColumnDef="nr">
    <th mat-header-cell *matHeaderCellDef>#</th>
    <td mat-cell *matCellDef="let team; let i = index">{{ i + 1 }}</td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let team">
      <span *ngIf="editId !== team.id">{{ team.name }}</span>
      <input *ngIf="editId === team.id" [(ngModel)]="editTeam.name" class="input-cell">
    </td>
  </ng-container>

  <ng-container matColumnDef="base">
    <th mat-header-cell *matHeaderCellDef>Base</th>
    <td mat-cell *matCellDef="let team">
      <span *ngIf="editId !== team.id">{{ team.base }}</span>
      <input *ngIf="editId === team.id" [(ngModel)]="editTeam.base" class="input-cell">
    </td>
  </ng-container>

  <ng-container matColumnDef="principal">
    <th mat-header-cell *matHeaderCellDef>Team Principal</th>
    <td mat-cell *matCellDef="let team">
      <span *ngIf="editId !== team.id">{{ team.principal }}</span>
      <input *ngIf="editId === team.id" [(ngModel)]="editTeam.principal" class="input-cell">
    </td>
  </ng-container>

  <ng-container matColumnDef="powerUnit">
    <th mat-header-cell *matHeaderCellDef>Power Unit</th>
    <td mat-cell *matCellDef="let team">
      <span *ngIf="editId !== team.id">{{ team.powerUnit }}</span>
      <input *ngIf="editId === team.id" [(ngModel)]="editTeam.powerUnit" class="input-cell">
    </td>
  </ng-container>

  <ng-container matColumnDef="color">
    <th mat-header-cell *matHeaderCellDef>Color</th>
    <td mat-cell *matCellDef="let team">
      <span *ngIf="editId !== team.id">{{ team.color }}</span>
      <input *ngIf="editId === team.id" [(ngModel)]="editTeam.color" class="input-cell"
             placeholder="e.g. #FF0000 or Mercedes Silver">
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let team">
      <div class="action-buttons">
        <button mat-icon-button color="primary" *ngIf="editId !== team.id" (click)="startEdit(team)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="accent" *ngIf="editId === team.id" (click)="update()">
          <mat-icon>save</mat-icon>
        </button>
        <button mat-icon-button *ngIf="editId === team.id" (click)="cancelEdit()">
          <mat-icon>close</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="delete(team.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns;"></tr>
</table>
