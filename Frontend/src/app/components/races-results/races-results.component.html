<table mat-table matSort [dataSource]="dataSource" class="mat-elevation-z8">

      <!-- Nr Column -->
      <ng-container matColumnDef="nr">
        <th mat-header-cell *matHeaderCellDef> # </th>
        <td mat-cell *matCellDef="let race_results; let i = index;"> {{ i + 1 }}. </td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="round">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> round </th>
        <td mat-cell *matCellDef="let race"> {{race.round}} </td>
      </ng-container>

      <!-- Base Column -->
      <ng-container matColumnDef="grandPrix">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> grandPrix </th>
        <td mat-cell *matCellDef="let race"> {{race.grandPrix}} </td>
      </ng-container>

      <!-- Principal Column -->
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> date </th>
        <td mat-cell *matCellDef="let race"> {{race.date}} </td>
      </ng-container>

      <!-- PowerUnit Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> status </th>
        <td mat-cell *matCellDef="let race"> {{race.status}} </td>
      </ng-container>

      <!-- Color Column -->
      <ng-container matColumnDef="circuitId">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> circuitId </th>
        <td mat-cell *matCellDef="let race"> {{race.circuitId}} </td>
      </ng-container>

      
      <!-- action Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="text-end"> Actions </th>
        <td mat-cell *matCellDef="let race" class="text-end">
            <!--
          <button mat-icon-button color="primary" (click)="openUserEditDialog(user.id)">
            <mat-icon>edit</mat-icon>
          </button>
        -->
          <button mat-icon-button color="warn" (click)="delete(user.id)">
            <mat-icon>delete</mat-icon>
          </button>

        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns;"></tr>
    </table>
